# agentcore configuration. Copy to agentcore.toml and adjust.
# Relative paths are resolved against this file's directory.

[server]
bind = "127.0.0.1:8080"
# URL of this server as seen from INSIDE the sandbox (for the MCP gateway).
# With docker-compose this is the service name on the internal network.
# gateway_url = "http://agentcore:8080"
ui_dir = "web/dist"

# Without operators the server refuses to bind to non-loopback addresses.
# Generate hashes with: agentcore hash-token '<token>'
# [[server.operators]]
# name = "alice"
# token_sha256 = "..."
# role = "operator"        # or "viewer" (watch only)

[storage]
data_dir = "data"
audit_fsync = true
audit_retention_days = 183

[policies]
dir = "policies"
default = "default"

[sandbox]
backend = "docker"          # "process" = no isolation, development only

[sandbox.docker]
image = "agentcore-sandbox:latest"   # docker build -t agentcore-sandbox:latest sandbox-image
network = "none"            # or an --internal network shared with agentcore
# runtime = "runsc"         # gVisor: strongly recommended for untrusted agents
user = "1000:1000"
memory = "4g"
cpus = "2"
pids_limit = 512

# [sandbox.process]
# allow_insecure = true

[transparency]
system_name = "agentcore"
provider = "Your organisation"
contact = "ai-oversight@example.com"
intended_purpose = "AI coding agents working as supervised collaborators on our repositories."

# ---- agents -----------------------------------------------------------------

[[agents]]
name = "opencode"
adapter = "opencode"
description = "opencode, with all side effects routed through the agentcore gateway."
policy = "default"
[agents.env]
ANTHROPIC_API_KEY = "{env:ANTHROPIC_API_KEY}"

[[agents]]
name = "demo"
adapter = "command"
description = "A scripted demo agent that exercises the gateway (needs curl in the image)."
command = "sh"
# The task is passed as $0, never interpolated into the script itself.
args = ["-c", """
call() { curl -s -X POST "$AGENTCORE_GATEWAY_URL" -H "Authorization: Bearer $AGENTCORE_GATEWAY_TOKEN" -H 'Content-Type: application/json' -d "$1"; echo; }
echo "Task: $0"
call '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"write_file","arguments":{"path":"NOTES.md","content":"# Notes\\n"}}}'
call '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"run_command","arguments":{"command":"git","args":["push"]}}}'
call '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"read_file","arguments":{"path":".env"}}}'
""", "{task}"]
